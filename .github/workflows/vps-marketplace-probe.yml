name: VPS marketplace probe

on:
  workflow_dispatch:
    inputs:
      query:
        description: Search phrase
        required: true
        default: "Onimusha Way of the Sword PS5"
      limit:
        description: Maximum listings (1-50)
        required: true
        default: "20"

permissions:
  contents: read

concurrency:
  group: vps-marketplace-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Run Mercado Livre probe from VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Connect runner to private tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy probe to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_TAILSCALE_IP }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          scp -o BatchMode=yes scripts/probe_mercado_livre.py \
            "$VPS_USER@$VPS_HOST:/tmp/promo-sniffer-probe.py"

      - name: Execute probe on VPS (no login/session)
        env:
          VPS_HOST: ${{ secrets.VPS_TAILSCALE_IP }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          QUERY: ${{ inputs.query }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          [[ "$LIMIT" =~ ^([1-9]|[1-4][0-9]|50)$ ]]
          QUERY_B64="$(printf '%s' "$QUERY" | base64 -w0)"
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "QUERY_B64='$QUERY_B64' LIMIT='$LIMIT' bash -lc 'QUERY=\$(printf %s \"\$QUERY_B64\" | base64 -d); exec python3 /tmp/promo-sniffer-probe.py --query \"\$QUERY\" --limit \"\$LIMIT\"'"
